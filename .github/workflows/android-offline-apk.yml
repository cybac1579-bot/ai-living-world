name: Android offline debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - source/AI_Living_World_Android_v1.3.zip
      - .github/workflows/android-offline-apk.yml

permissions:
  contents: read

jobs:
  build:
    name: Build offline-only Android prototype
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Unpack verified v1.3 development source
        shell: bash
        run: |
          mkdir -p src
          unzip -q source/AI_Living_World_Android_v1.3.zip -d src
          test -f src/android_native/app/build.gradle
          test -f src/tools/android_build_preflight.py
          test -f src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run source integrity and credential exclusion checks
        run: python src/tools/android_build_preflight.py --root src

      - name: Install Python test dependencies (CI runner only)
        run: python -m pip install --disable-pip-version-check -r src/requirements.txt

      - name: Restore non-secret historical regression fixture
        run: cp ci-fixtures/legacy_v071_events.jsonl src/tests/fixtures/legacy_v071_save/events.jsonl

      - name: Run all offline engine regression tests
        working-directory: src
        run: python -m unittest discover -s tests -q

      - name: Disable ChatGPT login and online GPT in this prototype APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          java = Path("src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java")
          s = java.read_text(encoding="utf-8")
          before = 'login.setOnClickListener(v -> doLogin());'
          assert s.count(before) == 1, 'Unexpected login button implementation'
          s = s.replace(before, 'login.setOnClickListener(v -> uiError("오프라인 테스트 APK: 로그인 비활성화"));')
          before = 'online.setOnClickListener(v -> startEngine(false));'
          assert s.count(before) == 1, 'Unexpected GPT button implementation'
          s = s.replace(before, 'online.setOnClickListener(v -> uiError("오프라인 테스트 APK: GPT 호출 비활성화"));')
          before = 'bar.addView(offline,new LinearLayout.LayoutParams(0, 56, 1f));'
          assert s.count(before) == 1, 'Unexpected button layout'
          s = s.replace(before, 'login.setEnabled(false); online.setEnabled(false);\n        ' + before)
          java.write_text(s, encoding="utf-8")

          # No outdated Android native cryptography libraries ship in the offline-only APK.
          gradle = Path("src/android_native/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          for dep in ("install 'PyJWT[crypto]==2.15.1'", "install 'cryptography==42.0.8'", "install 'cffi==1.17.1'"):
              assert g.count(dep) == 1, f"Unexpected dependency: {dep}"
          g = g.replace("install 'PyJWT[crypto]==2.15.1'", "install 'PyJWT==2.15.1'")
          g = g.replace("install 'cryptography==42.0.8'", "// Omitted: login disabled in offline-only APK")
          g = g.replace("install 'cffi==1.17.1'", "// Omitted: login disabled in offline-only APK")
          gradle.write_text(g, encoding="utf-8")
          assert "login.setEnabled(false); online.setEnabled(false);" in java.read_text(encoding="utf-8")
          assert "install 'cryptography==" not in gradle.read_text(encoding="utf-8")
          print("OFFLINE_ONLY_MODE=enabled; no live ChatGPT authentication available in this APK")
          PY

      - name: Strip internet access from offline debug manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("src/android_native/app/src/main/AndroidManifest.xml")
          assert manifest.is_file(), "Android manifest not found"
          android_ns = "http://schemas.android.com/apk/res/android"
          tools_ns = "http://schemas.android.com/tools"
          ET.register_namespace("android", android_ns)
          ET.register_namespace("tools", tools_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          assert root.tag == "manifest", "Unexpected Android manifest root"

          forbidden = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          }
          # Remove any app-declared network permissions.
          for node in list(root):
              if node.tag in ("uses-permission", "uses-permission-sdk-23"):
                  if node.get(f"{{{android_ns}}}name") in forbidden:
                      root.remove(node)

          # Also prevent transitive library manifests from restoring them.
          for name in sorted(forbidden):
              node = ET.Element("uses-permission")
              node.set(f"{{{android_ns}}}name", name)
              node.set(f"{{{tools_ns}}}node", "remove")
              root.insert(0, node)

          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          print("OFFLINE_MANIFEST=network_permissions_removed")
          PY

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble offline debug APK
        shell: bash
        run: gradle -p src/android_native :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK structure and checksum
        run: python src/tools/verify_debug_apk.py src/android_native/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaged APK has no internet permission
        shell: bash
        run: |
          set -euo pipefail
          apk="src/android_native/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/alw-apk-permissions.txt"
          cat "$RUNNER_TEMP/alw-apk-permissions.txt"
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' "$RUNNER_TEMP/alw-apk-permissions.txt"; then
            echo "::error::Offline APK unexpectedly requests network permissions"
            exit 1
          fi
          echo "OFFLINE_APK_NETWORK_PERMISSION_CHECK=PASS"

      - name: Publish offline-only APK to private prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="offline-debug-${GITHUB_SHA:0:12}"
          apk="src/android_native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#AI-Living-World-OFFLINE-debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk#AI-Living-World-OFFLINE-debug.apk" --repo "$GITHUB_REPOSITORY" --title "Offline Android debug APK - $tag" --notes "TEST BUILD ONLY. ChatGPT login and online model calls are disabled. Not tested on a real Android device. Offline demo UI / local save only." --prerelease
          fi
          echo "PRIVATE_RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
