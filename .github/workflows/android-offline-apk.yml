name: Android offline debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - source/AI_Living_World_Android_v1.3.zip
      - .github/workflows/android-offline-apk.yml
      - prototype/**
      - tools/**
      - assets/characters/rana/**

permissions:
  contents: read

jobs:
  build:
    name: Build offline-only Android prototype
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Unpack verified v1.3 development source
        shell: bash
        run: |
          mkdir -p src
          unzip -q source/AI_Living_World_Android_v1.3.zip -d src
          test -f src/android_native/app/build.gradle
          test -f src/tools/android_build_preflight.py
          test -f src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run source integrity and credential exclusion checks
        run: python src/tools/android_build_preflight.py --root src

      - name: Install Python test dependencies (CI runner only)
        run: python -m pip install --disable-pip-version-check -r src/requirements.txt

      - name: Restore non-secret historical regression fixture
        run: cp ci-fixtures/legacy_v071_events.jsonl src/tests/fixtures/legacy_v071_save/events.jsonl

      - name: Run all offline engine regression tests
        working-directory: src
        run: python -m unittest discover -s tests -q

      - name: Stage the Brena world and offline dialogue
        shell: bash
        run: |
          python tools/stage_brena_initial_asset.py src
          python tools/patch_brena_android_first_run.py src
          python tools/stage_brena_android.py src
          python tools/patch_brena_world_travel.py src/world_engine.py
          python tools/patch_brena_world_travel.py src/android_native/app/src/main/python/world_engine.py
          python tools/patch_brena_vn_state.py src/android_native/app/src/main/python/vn_server.py
          python tools/patch_brena_vn_travel.py src/android_native/app/src/main/python/vn_server.py
          python tools/patch_brena_vn_time.py src/android_native/app/src/main/python/vn_server.py
          PYTHONPATH=src/android_native/app/src/main/python:prototype python -m unittest prototype.test_brena_offline_travel_original_engine prototype.test_brena_atomic_tick_original_engine -v
          python tools/patch_brena_vn_ui.py src
          python tools/patch_brena_vn_visual_polish.py src
          python tools/patch_brena_rana_portrait.py src
          python tools/stage_rana_dialogue.py src
          python tools/stage_approved_rana_portrait.py src --approved-rana-portrait assets/characters/rana/neutral.webp

      - name: Verify offline dialogue and journal replay
        run: |
          python tools/check_rana_engine.py src
          python tools/check_rana_android_http.py src

      - name: Stage isolated subscription verification app
        run: python tools/stage_rana_plan_check.py src plan-check
      - name: Disable ChatGPT login and online GPT in this prototype APK
        run: python tools/disable_android_debug_login.py

      - name: Fix high-density Android debug toolbar and error visibility
        run: python tools/patch_android_debug_ui.py src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java

      - name: Expose native Android startup failure stage and WebView errors
        run: python tools/patch_android_startup_diagnostics.py src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java

      - name: Hide development toolbar when visual novel starts successfully
        run: python tools/patch_android_presentation_ui.py src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java

      - name: Verify local-only offline engine contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          java = Path('src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java').read_text(encoding='utf-8')
          py = Path('src/android_native/app/src/main/python/mobile_embedded.py').read_text(encoding='utf-8')
          manifest = Path('src/android_native/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          network = Path('src/android_native/app/src/main/res/xml/network_security_config.xml').read_text(encoding='utf-8')
          assert 'startEngine(true);' in java, 'initial screen must start in offline mode'
          assert 'login.setEnabled(false); online.setEnabled(false);' in java, 'online buttons must be disabled'
          assert "if offline:\n            token,models = None, []" in py, 'offline mode unexpectedly requests authentication'
          assert "('127.0.0.1',0)" in py, 'offline server must bind loopback only'
          assert 'android.permission.INTERNET' in manifest, 'Android loopback sockets REQUIRE INTERNET permission'
          assert '<domain>127.0.0.1</domain>' in network, 'cleartext loopback exception missing'
          print('OFFLINE_LOOPBACK_CONTRACT=PASS; online account access disabled in this build')
          PY

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble offline debug APK
        shell: bash
        run: gradle -p src/android_native :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK structure and checksum
        run: python src/tools/verify_debug_apk.py src/android_native/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaged APK permits required loopback networking
        shell: bash
        run: |
          set -euo pipefail
          apk="src/android_native/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/alw-apk-permissions.txt"
          cat "$RUNNER_TEMP/alw-apk-permissions.txt"
          if ! grep -Fq 'android.permission.INTERNET' "$RUNNER_TEMP/alw-apk-permissions.txt"; then
            echo "::error::The embedded 127.0.0.1 server needs Android INTERNET permission."
            exit 1
          fi
          echo "OFFLINE_LOOPBACK_PERMISSION_CHECK=PASS"

      - name: Verify identity checks and build non-debuggable subscription candidate
        run: |
          bash tools/plan_check/build.sh :plan-identity:test :app:assembleRelease
          apk=plan-check/app/build/outputs/apk/release/app-release.apk
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" > plan-check-badging.txt
          grep -F "package: name='com.ailivingworld.mobile.plancheck'" plan-check-badging.txt
          if grep -q 'application-debuggable' plan-check-badging.txt; then exit 1; fi
          cp "$apk" rana-plan-check.apk
      - name: Publish offline-only APK to private prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="offline-debug-${GITHUB_SHA:0:12}"
          apk="src/android_native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#AI-Living-World-OFFLINE-debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk#AI-Living-World-OFFLINE-debug.apk" --repo "$GITHUB_REPOSITORY" --title "Offline Android debug APK - $tag" --notes "TEST BUILD ONLY. ChatGPT login and online model calls are disabled. Not tested on a real Android device. Offline demo UI / local save only." --prerelease
          fi
          echo "PRIVATE_RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          gh release upload "$tag" rana-plan-check.apk --clobber --repo "$GITHUB_REPOSITORY"
