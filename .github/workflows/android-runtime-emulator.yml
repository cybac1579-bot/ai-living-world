name: Android runtime emulator smoke

on:
  push:
    branches: [main, 'development/stability-gates-20261123']
    paths:
      - .github/workflows/android-runtime-emulator.yml
      - tools/android_emulator_smoke.sh
      - tools/patch_android_startup_diagnostics.py
      - tools/patch_android_presentation_ui.py
      - tools/patch_android_debug_ui.py
      - tools/stage_brena_android.py
      - tools/patch_brena_vn_state.py
      - tools/patch_brena_vn_ui.py
      - tools/audit_brena_vn_apk.py
      - prototype/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Launch offline world on Android x86_64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source and prepare offline-only emulator variant
        shell: bash
        run: |
          mkdir -p src
          unzip -q source/AI_Living_World_Android_v1.3.zip -d src
          python tools/stage_brena_android.py src
          python tools/patch_brena_vn_state.py src/android_native/app/src/main/python/vn_server.py
          python tools/patch_brena_vn_ui.py src
          PYTHONPATH=src python - <<'PY'
          from brena_simulation import BrenaWorld
          from brena_android_boundary import npc_view
          assert npc_view(BrenaWorld.new(), 'rana').npc_id == 'rana'
          print('BRENA_APK_SOURCE_STAGED=PASS')
          PY
          python - <<'PY'
          from pathlib import Path
          java=Path('src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          a='login.setOnClickListener(v -> doLogin());'
          b='online.setOnClickListener(v -> startEngine(false));'
          c='bar.addView(offline,new LinearLayout.LayoutParams(0, 56, 1f));'
          assert s.count(a)==s.count(b)==s.count(c)==1
          s=s.replace(a, 'login.setOnClickListener(v -> uiError("오프라인: 로그인 차단"));')
          s=s.replace(b, 'online.setOnClickListener(v -> uiError("오프라인: GPT 차단"));')
          s=s.replace(c, 'login.setEnabled(false); online.setEnabled(false);\n        '+c)
          java.write_text(s,encoding='utf-8')
          gradle=Path('src/android_native/app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          assert g.count("abiFilters 'arm64-v8a'")==1
          assert g.count("install 'PyJWT[crypto]==2.15.1'")==1
          for dep in ("install 'cryptography==42.0.8'","install 'cffi==1.17.1'"):
              assert g.count(dep)==1
              g=g.replace(dep, '// omitted in offline-only emulator')
          g=g.replace("install 'PyJWT[crypto]==2.15.1'","install 'PyJWT==2.15.1'")
          g=g.replace("abiFilters 'arm64-v8a'","abiFilters 'x86_64'")
          gradle.write_text(g,encoding='utf-8')
          PY
          python tools/patch_android_debug_ui.py src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java
          python tools/patch_android_startup_diagnostics.py src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java
          python tools/patch_android_presentation_ui.py src/android_native/app/src/main/java/com/ailivingworld/mobile/MainActivity.java
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm Chaquopy build Python available
        run: python --version && command -v python
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile x86_64 debug APK for emulator
        run: gradle -p src/android_native :app:assembleDebug --no-daemon --stacktrace
      - name: Verify x86_64 emulator APK contains Rana UI and Python bridge
        run: python tools/audit_brena_vn_apk.py src src/android_native/app/build/outputs/apk/debug/app-debug.apk
      # The 2026-11-23 run failed before Android boot: emulator FATAL said
      # only 7033 MB free while userdata creation required 7373 MB.
      # Remove unused preinstalled runner SDKs after APK compilation.
      - name: Free runner disk space for Android emulator userdata
        shell: bash
        run: |
          echo "Before cleanup:"
          df -h "$HOME"
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          echo "After cleanup:"
          df -h "$HOME"
          available_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          if [ "$available_kb" -lt 10485760 ]; then
            echo "::error::Less than 10 GiB free for emulator userdata"
            exit 1
          fi
      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 15 emulator and check local world startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The prior swiftshader_indirect runs lost emulator-5554 before Android booted.
          # Use software rendering without the deprecated indirect backend and allow
          # extra time on hosted runners. This is an emulator-only smoke test.
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader -no-metrics
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash tools/android_emulator_smoke.sh
      # The emulator runner can fail before the smoke script executes. Capture
      # host-side evidence even when there is no adb device or screenshot.
      - name: Capture emulator boot failure evidence
        if: failure()
        shell: bash
        run: |
          # This step must never fail merely because the emulator or adb is absent.
          # Preserve diagnostics even when the runner cannot boot a device.
          set +e
          mkdir -p "$RUNNER_TEMP"
          {
            echo "== UTC time =="; date -u
            echo "== adb devices =="; adb devices -l
            echo "== KVM =="; ls -l /dev/kvm
            echo "== memory =="; free -h
            echo "== disk =="; df -h /
            echo "== emulator processes =="; ps -ef | grep -E '[e]mulator|[q]emu|[a]db'
            echo "== emulator log candidates =="
            find "$HOME/.android" /tmp -maxdepth 3 -type f -iname '*emulator*.log' -print 2>/dev/null | head -40
            find "$HOME/.android" /tmp -maxdepth 3 -type f -iname '*qemu*.log' -print 2>/dev/null | head -40
          } > "$RUNNER_TEMP/alw-emulator-host-diagnostics.txt" 2>&1
          cat "$RUNNER_TEMP/alw-emulator-host-diagnostics.txt" || true
          # Job summaries remain readable even when artifact upload itself fails.
          # Keep the output bounded and avoid exposing account/token environment variables.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo '### Android emulator host diagnostics'
              echo 'The emulator boot step failed; APK compilation status is separate.'
              echo '```text'
              head -c 12000 "$RUNNER_TEMP/alw-emulator-host-diagnostics.txt" || true
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      # Preserve evidence for visual review; pageFinished alone is not a rendered-scene assertion.
      # This is the offline-only emulator variant: no account login or GPT data is present.
      - name: Upload emulator screenshot and startup diagnostics
        if: always()
        # GitHub artifact storage quota can be exhausted independently of the APK
        # build and emulator result. Keep the actual boot failure as the CI failure.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-visual-smoke
          path: |
            ${{ runner.temp }}/alw-screen.png
            ${{ runner.temp }}/alw-ui.xml
            ${{ runner.temp }}/alw-startup-log.txt
            ${{ runner.temp }}/alw-emulator-host-diagnostics.txt
          if-no-files-found: warn
          retention-days: 3
