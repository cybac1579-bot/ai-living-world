name: Brena original engine contract inspection

on:
  push:
    branches: [main, 'development/stability-gates-20261123']
    paths:
      - .github/workflows/brena-engine-contract.yml
      - source/AI_Living_World_Android_v1.3.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract original engine and document movement action contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          unzip -q source/AI_Living_World_Android_v1.3.zip -d src
          python - <<'PY'
          import ast
          from pathlib import Path
          paths=list(Path('src').rglob('world_engine.py'))+list(Path('src').rglob('vn_server.py'))
          if not paths:
              raise SystemExit('Original engine/server files not found')
          lines=['# Original Android movement/action contracts','']
          for path in paths:
              lines.append('## '+str(path))
              tree=ast.parse(path.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      if any(k in node.name.lower() for k in ('move','travel','action','post','commit','apply','event')):
                          args=', '.join(a.arg for a in node.args.args)
                          lines.append(f'- line {node.lineno}: {node.name}({args})')
                  if isinstance(node,ast.Constant) and isinstance(node.value,str):
                      if any(k in node.value.lower() for k in ('move','travel','destination')):
                          lines.append(f'- string line {node.lineno}: {node.value[:120]!r}')
              lines.append('')
          # Capture exact original movement and POST paths for safe UI integration.
          for path in paths:
              source=path.read_text(encoding='utf-8').splitlines()
              tree=ast.parse(chr(10).join(source))
              for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in (
                      'resolve_explicit_movement','do_POST','commit','_commit_unlocked','turn','transition'):
                      start=max(0,node.lineno-3)
                      stop=min(len(source),node.end_lineno+2)
                      lines.append(f'## Implementation: {path}:{node.lineno}-{node.end_lineno}')
                      lines.extend(f'{i+1}: {source[i]}' for i in range(start,stop))
                      lines.append('')
          for path in Path('src').rglob('app.js'):
              lines.append('## Browser turn submission: '+str(path))
              source=path.read_text(encoding='utf-8').splitlines()
              matches=[i for i,line in enumerate(source) if '/api/turn' in line or 'fetch(' in line or 'move_to' in line]
              for i in matches[:25]:
                  lines.extend(f'{j+1}: {source[j]}' for j in range(max(0,i-6),min(len(source),i+9)))
          Path('movement-contract.md').write_text(chr(10).join(lines)+chr(10),encoding='utf-8')
          print(Path('movement-contract.md').read_text(encoding='utf-8')[:40000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brena-original-engine-contract
          path: movement-contract.md
          retention-days: 7
