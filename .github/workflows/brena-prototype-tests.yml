name: Brena simulation prototype tests

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/brena-prototype-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standalone Brena regression tests
        run: python -m unittest discover -s prototype -p 'test_*.py' -v
