plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.ailivingworld.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ailivingworld.mobile'
        minSdk 28
        targetSdk 35
        versionCode 13
        versionName '1.3-build-candidate'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            // Pinned for deterministic Android cp311 arm64 wheels.
            // Verified AVAILABLE on Chaquopy Android index, NOT runtime-installed here.
            // This is for a private prototype only: review cryptography security
            // support and update/pin safely before a production release.
            install 'PyJWT[crypto]==2.15.1'
            install 'cryptography==42.0.8'
            install 'cffi==1.17.1'
        }
    }
}
